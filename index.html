<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ LQ — Career Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #f59e0b; /* Vinyl Gold */
            --accent-hover: #d97706;
            --neon-pink: #ec4899;
            --neon-cyan: #06b6d4;
            --danger: #ef4444;
            --success: #10b981;
            --info: #3b82f6;
            --gradient-brand: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #06b6d4 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.05) 0%, transparent 40%);
        }

        /* Sidebar Styling */
        sidebar {
            width: 280px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 4px 0 24px rgba(0,0,0,0.02);
            z-index: 10;
        }

        .brand {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 2px dashed var(--border-color);
        }

        .brand h2 {
            font-family: 'Syncopate', sans-serif;
            color: #0f172a;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .nav-links {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            text-align: left;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--accent);
            transform: translateX(4px);
        }

        .nav-btn.active {
            background: var(--gradient-brand);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        /* Social Hub Sidebar Widget */
        .social-hub {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-top: 16px;
        }

        .social-hub h4 {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .social-link {
            color: var(--text-main);
            font-size: 0.78rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .social-link:hover {
            background-color: rgba(6, 182, 212, 0.1);
            color: var(--neon-cyan);
            padding-left: 10px;
        }

        /* Main Content Layout */
        main {
            flex-grow: 1;
            padding: 32px 40px;
            overflow-y: auto;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .btn {
            background: var(--gradient-brand);
            color: #ffffff;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards & Grids */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--gradient-brand);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
        }

        .badge {
            font-size: 0.68rem;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-confirmed { background-color: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-pending { background-color: rgba(245, 158, 11, 0.1); color: #b45309; border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-lead { background-color: rgba(6, 182, 212, 0.1); color: var(--info); border: 1px solid rgba(6, 182, 212, 0.2); }

        .card-body p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .card-body strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .financial-row {
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-top: 4px;
            border: 1px solid var(--border-color);
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            margin-top: 6px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-edit { color: var(--info); }
        .btn-edit:hover { opacity: 0.8; text-decoration: underline; }
        .btn-delete { color: var(--danger); }
        .btn-delete:hover { opacity: 0.8; text-decoration: underline; }

        /* Modal Form */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            padding: 32px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal h3 {
            margin-bottom: 20px;
            font-size: 1.35rem;
            font-weight: 700;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-secondary:hover {
            background: #f1f5f9;
        }
    </style>
</head>
<body>

    <sidebar>
        <div>
            <div class="brand">
                <h2>DJ LQ</h2>
                <p>Career Hub</p>
            </div>
            <div class="nav-links">
                <button class="nav-btn active" onclick="switchTab('bookings', this)">🎛️ Active Bookings</button>
                <button class="nav-btn" onclick="switchTab('schedule', this)">📅 Schedule Manager</button>
                <button class="nav-btn" onclick="switchTab('pipeline', this)">🚀 Projected Pipeline</button>
                <button class="nav-btn" onclick="switchTab('finances', this)">💰 Payment Tracking</button>
                <button class="nav-btn" onclick="switchTab('tasks', this)">🎧 Studio Tasks</button>
                <button class="nav-btn" onclick="switchTab('crate', this)">💿 Crate Digging</button>
                <button class="nav-btn" onclick="switchTab('gear', this)">⚡ Gear & Gadgets</button>
            </div>
        </div>

        <div class="social-hub">
            <h4>Social Hub</h4>
            <div class="social-links">
                <a href="https://facebook.com/DJLQMusic" target="_blank" class="social-link">🌐 Facebook</a>
                <a href="https://youtube.com/@DJLQMusic" target="_blank" class="social-link">▶️ YouTube</a>
                <a href="https://instagram.com/DJLQMusic" target="_blank" class="social-link">📸 Instagram</a>
                <a href="https://tiktok.com/@DJLQMusic" target="_blank" class="social-link">🎵 TikTok</a>
                <a href="https://soundcloud.com/DJLQMusic" target="_blank" class="social-link">☁️ SoundCloud</a>
            </div>
        </div>
    </sidebar>

    <main>
        <!-- TAB 1: ACTIVE BOOKINGS -->
        <div id="bookings-tab" class="tab-content active">
            <header>
                <h1>Active Bookings</h1>
                <button class="btn" onclick="openModal('booking')">+ New Booking</button>
            </header>
            <div id="bookings-grid" class="grid"></div>
        </div>

        <!-- TAB 2: SCHEDULE MANAGER -->
        <div id="schedule-tab" class="tab-content">
            <header>
                <h1>Schedule Manager & Timeline</h1>
            </header>
            <div id="schedule-grid" class="grid"></div>
        </div>

        <!-- TAB 3: PROJECTED PIPELINE -->
        <div id="pipeline-tab" class="tab-content">
            <header>
                <h1>Projected Gigs Pipeline</h1>
                <button class="btn" onclick="openModal('pipeline')">+ Add Target Gig</button>
            </header>
            <div id="pipeline-grid" class="grid"></div>
        </div>

        <!-- TAB 4: PAYMENT TRACKING -->
        <div id="finances-tab" class="tab-content">
            <header>
                <h1>Payment & Revenue Tracking</h1>
            </header>
            <div id="finances-grid" class="grid"></div>
        </div>

        <!-- TAB 5: STUDIO TASKS -->
        <div id="tasks-tab" class="tab-content">
            <header>
                <h1>Studio Tasks & Routine</h1>
                <button class="btn" onclick="openModal('task')">+ Add Task</button>
            </header>
            <div id="tasks-grid" class="grid"></div>
        </div>

        <!-- TAB 6: CRATE DIGGING WISHLIST -->
        <div id="crate-tab" class="tab-content">
            <header>
                <h1>Crate Digging Wishlist (Tracks to Download)</h1>
                <button class="btn" onclick="openModal('crate')">+ Add Track</button>
            </header>
            <div id="crate-grid" class="grid"></div>
        </div>

        <!-- TAB 7: GEAR & GADGETS -->
        <div id="gear-tab" class="tab-content">
            <header>
                <h1>Gear & Gadgets Wishlist</h1>
                <button class="btn" onclick="openModal('gear')">+ Add Item</button>
            </header>
            <div id="gear-grid" class="grid"></div>
        </div>
    </main>

    <div id="app-modal" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Add Entry</h3>
            <form id="dynamic-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="form-type">
                <input type="hidden" id="edit-item-id">
                
                <!-- STANDARD BOOKING/PIPELINE FIELDS -->
                <div id="fields-booking">
                    <div class="form-group">
                        <label>Event / Client Name</label>
                        <input type="text" id="f-title" class="form-control" placeholder="e.g., Summer Cooler Fete / John Doe">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Event Type</label>
                            <select id="f-type" class="form-control">
                                <option value="Club Night">Club Night</option>
                                <option value="Private Party">Private Party</option>
                                <option value="Carnival Fete">Carnival Fete</option>
                                <option value="Wedding">Wedding</option>
                                <option value="Corporate">Corporate</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Date & Time</label>
                            <input type="datetime-local" id="f-date" class="form-control">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Venue Location</label>
                            <input type="text" id="f-location" class="form-control" placeholder="Venue & Address">
                        </div>
                        <div class="form-group">
                            <label>Expected Audience</label>
                            <input type="number" id="f-pax" class="form-control" placeholder="e.g. 250">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Total Price (TTD)</label>
                            <input type="number" id="f-price" class="form-control" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Down Payment Status</label>
                            <select id="f-deposit" class="form-control">
                                <option value="Pending">Deposit Pending</option>
                                <option value="Paid">Deposit Paid</option>
                                <option value="Fully Paid">Fully Paid</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Service Package</label>
                        <select id="f-package" class="form-control">
                            <option value="DJ Services Only">DJ Services Only (Plug into in-house sound)</option>
                            <option value="Full DJ Package">Full DJ Package (Speakers, Lights, Consoles)</option>
                        </select>
                    </div>
                </div>

                <!-- STUDIO TASK FIELDS -->
                <div id="fields-task" style="display:none;">
                    <div class="form-group">
                        <label>Task Description</label>
                        <input type="text" id="t-title" class="form-control" placeholder="e.g., Record August Soca Mixtape">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category</label>
                            <select id="t-category" class="form-control">
                                <option value="Practice / Mixing">Practice / Mixing</option>
                                <option value="Mixtape Production">Mixtape Production</option>
                                <option value="Serato Library Management">Serato Library Management</option>
                                <option value="Music Downloading">Music Downloading</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Priority</label>
                            <select id="t-priority" class="form-control">
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- CRATE DIGGING FIELDS -->
                <div id="fields-crate" style="display:none;">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Track Title & Artist</label>
                            <input type="text" id="c-title" class="form-control" placeholder="e.g., Artist - Track Name">
                        </div>
                        <div class="form-group">
                            <label>Genre</label>
                            <select id="c-genre" class="form-control">
                                <option value="Soca">Soca</option>
                                <option value="Dancehall">Dancehall</option>
                                <option value="Reggae">Reggae</option>
                                <option value="Afrobeat">Afrobeat</option>
                                <option value="Hip Hop">Hip Hop</option>
                                <option value="Remixes">Remixes</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Download Source / Link</label>
                        <input type="text" id="c-source" class="form-control" placeholder="e.g., SoundCloud pool, Record label direct">
                    </div>
                </div>

                <!-- GEAR & GADGETS FIELDS -->
                <div id="fields-gear" style="display:none;">
                    <div class="form-group">
                        <label>Item Name</label>
                        <input type="text" id="g-title" class="form-control" placeholder="e.g., Heavy-Duty Laptop Stand">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Estimated Cost (TTD)</label>
                            <input type="number" id="g-price" class="form-control" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Priority</label>
                            <select id="g-priority" class="form-control">
                                <option value="High">High Priority</option>
                                <option value="Researching">Researching / Future</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Amazon / Store Link (URL)</label>
                        <input type="url" id="g-link" class="form-control" placeholder="https://amazon.com/dp/...">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Save Entry</button>
                </div>
            </form>
        </div>
    </div>

                { id: 114, title: "Saltfish - Jab King", genre: "Soca", source: "SoundCloud", status: "Needed" }
            ],

                { id: 7, title: "Heavy-Duty Laptop Stand", price: 450, priority: "High", link: "https://amazon.com" }
            ]
        };

        function saveData() {
            localStorage.setItem('djlq_app_data', JSON.stringify(appData));
            renderAll();
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId + '-tab').classList.add('active');
            if (btnElement) btnElement.classList.add('active');
        }

        function openModal(type, editId = null) {
            document.getElementById('form-type').value = type;
            const modalTitle = document.getElementById('modal-title');
            
            document.getElementById('fields-booking').style.display = (type === 'booking' || type === 'pipeline') ? 'block' : 'none';
            document.getElementById('fields-task').style.display = (type === 'task') ? 'block' : 'none';
            document.getElementById('fields-crate').style.display = (type === 'crate') ? 'block' : 'none';
            document.getElementById('fields-gear').style.display = (type === 'gear') ? 'block' : 'none';

            if (editId) {
                modalTitle.innerText = `Edit Entry`;
                document.getElementById('edit-item-id').value = editId;
                
                let collection = type === 'booking' ? appData.bookings : 
                                 type === 'pipeline' ? appData.pipeline : 
                                 type === 'task' ? appData.tasks : 
                                 type === 'crate' ? appData.crate : appData.gear;
                const item = collection.find(i => i.id === editId);
                
                if (item) {
                    if (type === 'booking' || type === 'pipeline') {
                        document.getElementById('f-title').value = item.title;
                        document.getElementById('f-type').value = item.type;
                        document.getElementById('f-date').value = item.date;
                        document.getElementById('f-location').value = item.location;
                        document.getElementById('f-pax').value = item.pax;
                        document.getElementById('f-price').value = item.price;
                        document.getElementById('f-deposit').value = item.deposit;
                        document.getElementById('f-package').value = item.package;
                    } else if (type === 'task') {
                        document.getElementById('t-title').value = item.title;
                        document.getElementById('t-category').value = item.category;
                        document.getElementById('t-priority').value = item.priority;
                    } else if (type === 'crate') {
                        document.getElementById('c-title').value = item.title;
                        document.getElementById('c-genre').value = item.genre;
                        document.getElementById('c-source').value = item.source;
                    } else if (type === 'gear') {
                        document.getElementById('g-title').value = item.title;
                        document.getElementById('g-price').value = item.price;
                        document.getElementById('g-priority').value = item.priority;
                        document.getElementById('g-link').value = item.link;
                    }
                }
            } else {
                modalTitle.innerText = `Add New Entry`;
                document.getElementById('edit-item-id').value = '';
                document.getElementById('dynamic-form').reset();
            }
            
            document.getElementById('app-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('app-modal').classList.remove('open');
            document.getElementById('dynamic-form').reset();
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const type = document.getElementById('form-type').value;
            const editId = document.getElementById('edit-item-id').value;
            
            let itemData = { id: editId ? parseInt(editId) : Date.now() };
            let collectionName = type;

            if (type === 'booking' || type === 'pipeline') {
                itemData.title = document.getElementById('f-title').value;
                itemData.type = document.getElementById('f-type').value;
                itemData.date = document.getElementById('f-date').value;
                itemData.location = document.getElementById('f-location').value;
                itemData.pax = document.getElementById('f-pax').value || 0;
                itemData.price = parseFloat(document.getElementById('f-price').value) || 0;
                itemData.deposit = document.getElementById('f-deposit').value;
                itemData.package = document.getElementById('f-package').value;
                collectionName = type === 'booking' ? 'bookings' : 'pipeline';
            } else if (type === 'task') {
                itemData.title = document.getElementById('t-title').value;
                itemData.category = document.getElementById('t-category').value;
                itemData.priority = document.getElementById('t-priority').value;
                itemData.completed = false;
                collectionName = 'tasks';
            } else if (type === 'crate') {
                itemData.title = document.getElementById('c-title').value;
                itemData.genre = document.getElementById('c-genre').value;
                itemData.source = document.getElementById('c-source').value;
                itemData.status = "Needed";
                collectionName = 'crate';
            } else if (type === 'gear') {
                itemData.title = document.getElementById('g-title').value;
                itemData.price = parseFloat(document.getElementById('g-price').value) || 0;
                itemData.priority = document.getElementById('g-priority').value;
                itemData.link = document.getElementById('g-link').value;
                collectionName = 'gear';
            }

            if (editId) {
                let index = appData[collectionName].findIndex(i => i.id === parseInt(editId));
                if (index !== -1) {
                    appData[collectionName][index] = itemData;
                }
            } else {
                appData[collectionName].push(itemData);
            }

            saveData();
            closeModal();
        }

        function deleteItem(id, collectionName) {
            appData[collectionName] = appData[collectionName].filter(item => item.id !== id);
            saveData();
        }

        function toggleTask(id) {
            let task = appData.tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveData();
            }
        }

        function toggleCrateStatus(id) {
            let track = appData.crate.find(c => c.id === id);
            if (track) {
                track.status = track.status === 'Needed' ? 'Acquired' : 'Needed';
                saveData();
            }
        }

        function renderAll() {
            // Render Bookings
            const bookingsGrid = document.getElementById('bookings-grid');
            bookingsGrid.innerHTML = appData.bookings.length ? '' : '<p style="color:var(--text-muted)">No active bookings recorded yet.</p>';
            appData.bookings.forEach(item => {
                bookingsGrid.innerHTML += createBookingCardHTML(item, 'bookings');
            });

            // Render Schedule Manager
            const scheduleGrid = document.getElementById('schedule-grid');
            const allEvents = [...appData.bookings].sort((a,b) => new Date(a.date) - new Date(b.date));
            scheduleGrid.innerHTML = allEvents.length ? '' : '<p style="color:var(--text-muted)">No upcoming schedule entries.</p>';
            allEvents.forEach(item => {
                scheduleGrid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${item.title}</span>
                            <span class="badge badge-confirmed">Timeline Active</span>
                        </div>
                        <div class="card-body">
                            <p>📅 <strong>Date:</strong> ${new Date(item.date).toLocaleString()}</p>
                            <p>📍 <strong>Location:</strong> ${item.location}</p>
                            <div style="margin-top:12px; background:#fffbeb; padding:10px; border-radius:8px; border-left:4px solid var(--accent); border: 1px solid #fef3c7;">
                                <p style="font-size:0.7rem; color:#b45309; font-weight:700; letter-spacing:0.5px;">DAY-OF TIMELINE</p>
                                <p style="font-size:0.8rem; margin-top:4px;">• Load-in & Gear Check: 2 hours prior</p>
                                <p style="font-size:0.8rem;">• Sound Check: 1 hour prior</p>
                                <p style="font-size:0.8rem;">• Set Starts: ${new Date(item.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Render Pipeline
            const pipelineGrid = document.getElementById('pipeline-grid');
            pipelineGrid.innerHTML = appData.pipeline.length ? '' : '<p style="color:var(--text-muted)">No projected target gigs in pipeline.</p>';
            appData.pipeline.forEach(item => {
                pipelineGrid.innerHTML += createBookingCardHTML(item, 'pipeline');
            });

            // Render Finances
            const financesGrid = document.getElementById('finances-grid');
            let totalRevenue = appData.bookings.reduce((acc, curr) => acc + curr.price, 0);
            let pendingDeposits = appData.bookings.filter(b => b.deposit === 'Pending').length;

            financesGrid.innerHTML = `
                <div class="card">
                    <div class="card-header"><span class="card-title">Total Booked Revenue</span></div>
                    <div class="card-body">
                        <h2 style="color:var(--accent); font-size:2.2rem; font-weight:800; margin:8px 0;">TTD $${totalRevenue.toLocaleString()}</h2>
                        <p>Aggregated value across all confirmed active bookings.</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><span class="card-title">Deposit Alerts</span></div>
                    <div class="card-body">
                        <h2 style="color:var(--danger); font-size:2.2rem; font-weight:800; margin:8px 0;">${pendingDeposits} Pending</h2>
                        <p>Bookings requiring down payment confirmation.</p>
                    </div>
                </div>
            `;

            // Render Tasks
            const tasksGrid = document.getElementById('tasks-grid');
            tasksGrid.innerHTML = appData.tasks.length ? '' : '<p style="color:var(--text-muted)">No studio tasks listed.</p>';
            appData.tasks.forEach(item => {
                tasksGrid.innerHTML += `
                    <div class="card" style="opacity: ${item.completed ? 0.6 : 1}">
                        <div class="card-header">
                            <span class="card-title" style="text-decoration: ${item.completed ? 'line-through' : 'none'}">${item.title}</span>
                            <span class="badge ${item.priority === 'High' ? 'badge-pending' : 'badge-confirmed'}">${item.priority}</span>
                        </div>
                        <div class="card-body">
                            <p>📂 <strong>Category:</strong> ${item.category}</p>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn btn-edit" onclick="toggleTask(${item.id})">${item.completed ? 'Mark Incomplete' : 'Mark Complete'}</button>
                            <button class="action-btn btn-delete" onclick="deleteItem(${item.id}, 'tasks')">Delete</button>
                        </div>
                    </div>
                `;
            });

            // Render Crate Digging Wishlist with Genre Tabs
            const crateContainer = document.getElementById('crate-tab');
            let currentGenre = window.activeCrateGenre || 'Soca';
            const genres = ['Soca', 'Dancehall', 'Reggae', 'Afrobeat', 'Hip Hop', 'Remixes', 'Other'];

            let genreButtonsHTML = genres.map(g => `
                <button onclick="selectCrateGenre('${g}')" style="
                    padding: 8px 16px; 
                    border-radius: 20px; 
                    border: 1px solid var(--border-color); 
                    background: ${currentGenre === g ? 'var(--gradient-brand)' : '#ffffff'}; 
                    color: ${currentGenre === g ? '#ffffff' : 'var(--text-main)'}; 
                    font-weight: 600; 
                    cursor: pointer;
                    font-size: 0.8rem;
                    box-shadow: ${currentGenre === g ? '0 4px 12px rgba(245,158,11,0.3)' : 'none'};
                    transition: all 0.2s;
                ">${g}</button>
            `).join('');

            const filteredTracks = appData.crate.filter(t => t.genre === currentGenre);
            let tracksHTML = filteredTracks.length ? `
                <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);">
                    <div style="display: flex; padding: 14px 20px; background: #f8fafc; border-bottom: 1px solid var(--border-color); font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">
                        <div style="flex: 2;">Track & Artist</div>
                        <div style="flex: 1.5;">Source / Link</div>
                        <div style="flex: 1; text-align: center;">Status</div>
                        <div style="flex: 1; text-align: right;">Actions</div>
                    </div>
                    ${filteredTracks.map(item => `
                        <div style="display: flex; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; transition: background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='transparent'">
                            <div style="flex: 2; font-weight: 600; color: var(--text-main);">🎵 ${item.title}</div>
                            <div style="flex: 1.5; color: var(--text-muted);">${item.source}</div>
                            <div style="flex: 1; text-align: center;">
                                <span class="badge ${item.status === 'Acquired' ? 'badge-confirmed' : 'badge-pending'}">${item.status}</span>
                            </div>
                            <div style="flex: 1; text-align: right; display: flex; justify-content: flex-end; gap: 12px;">
                                <button class="action-btn btn-edit" onclick="toggleCrateStatus(${item.id})">${item.status === 'Needed' ? 'Mark Acquired' : 'Mark Needed'}</button>
                                <button class="action-btn btn-delete" onclick="deleteItem(${item.id}, 'crate')">Delete</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            ` : `<p style="color:var(--text-muted);">No tracks found in ${currentGenre}.</p>`;

            crateContainer.innerHTML = `
                <header>
                    <h1>Crate Digging Wishlist (Tracks to Download)</h1>
                    <button class="btn" onclick="openModal('crate')">+ Add Track</button>
                </header>
                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px;">
                    ${genreButtonsHTML}
                </div>
                <div>
                    ${tracksHTML}
                </div>
            `;

            // Render Gear Wishlist
            const gearGrid = document.getElementById('gear-grid');
            gearGrid.innerHTML = appData.gear.length ? '' : '<p style="color:var(--text-muted)">No gear saved to wishlist.</p>';
            appData.gear.forEach(item => {
                gearGrid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${item.title}</span>
                            <span class="badge badge-confirmed">TTD $${item.price.toLocaleString()}</span>
                        </div>
                        <div class="card-body">
                            <p>⭐ <strong>Priority:</strong> ${item.priority}</p>
                            ${item.link ? `<p>🔗 <a href="${item.link}" target="_blank" style="color:var(--info); font-weight:600;">View Amazon Link</a></p>` : ''}
                        </div>
                        <div class="card-actions">
                            <button class="action-btn btn-delete" onclick="deleteItem(${item.id}, 'gear')">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        function selectCrateGenre(genre) {
            window.activeCrateGenre = genre;
            renderAll();
        }

        function createBookingCardHTML(item, collectionName) {
            const formType = collectionName === 'bookings' ? 'booking' : 'pipeline';
            return `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">${item.title}</span>
                        <span class="badge ${item.deposit === 'Paid' ? 'badge-confirmed' : 'badge-pending'}">${item.deposit || 'Lead'}</span>
                    </div>
                    <div class="card-body">
                        <p>🏷️ <strong>Type:</strong> ${item.type}</p>
                        <p>📅 <strong>Date:</strong> ${new Date(item.date).toLocaleString()}</p>
                        <p>📍 <strong>Location:</strong> ${item.location}</p>
                        <p>👥 <strong>Expected Pax:</strong> ${item.pax}</p>
                        <p>🎛️ <strong>Package:</strong> ${item.package}</p>
                        <div class="financial-row">
                            <span>Quoted Price:</span>
                            <strong>TTD $${item.price.toLocaleString()}</strong>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="action-btn btn-edit" onclick="openModal('${formType}', ${item.id})">Edit Details</button>
                        <button class="action-btn btn-delete" onclick="deleteItem(${item.id}, '${collectionName}')">Delete</button>
                    </div>
                </div>
            `;
        }

        renderAll();
    </script>
</body>
</html>
